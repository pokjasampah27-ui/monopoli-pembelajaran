<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monopoli Pembelajaran</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #163b2c;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            width: min(90%, 600px);
            padding: 40px 25px;
            background: white;
            color: #163b2c;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 14px 30px;
            border: 0;
            border-radius: 10px;
            background: #163b2c;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #255743;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>MONOPOLI PEMBELAJARAN</h1>

    <p>
        Bahasa Indonesia
    </p>

    <p>
        Fungsi Kalimat & Ragam Paragraf
    </p>

    <button onclick="mulaiGame()">
        MULAI PERMAINAN
    </button>

    <div id="status"></div>

</div>

<script>

function mulaiGame() {
    document.getElementById("status").textContent =
        "Tombol berhasil bekerja! Game siap dikembangkan.";
}

</script>

</body>
</html>
