<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monopoli Pembelajaran</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #163b2c;
            font-family: Arial, sans-serif;
            color: #222;
        }

        header {
            background: #163b2c;
            color: white;
            text-align: center;
            padding: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            opacity: .85;
        }

        .game-container {
            width: min(1400px, 96%);
            margin: 15px auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 15px;
        }

        .board-container {
            background: #111;
            padding: 8px;
            border-radius: 12px;
        }

        .board {
            width: 100%;
            background: white;
            border-radius: 6px;
            overflow: hidden;
        }

        .board img {
            display: block;
            width: 100%;
            height: auto;
        }

        .panel {
            background: #fffdf7;
            border-radius: 12px;
            padding: 18px;
        }

        .panel h2 {
            margin-top: 0;
            color: #163b2c;
        }

        .player-box {
            padding: 12px;
            background: #edf3ef;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .money {
            color: #176b3a;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 0;
            border-radius: 8px;
            background: #163b2c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #255743;
        }

        .dice {
            text-align: center;
            font-size: 60px;
            margin: 10px 0;
        }

        #status {
            margin-top: 12px;
            padding: 10px;
            background: #f0eadb;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 900px) {

            .game-container {
                grid-template-columns: 1fr;
            }

            .panel {
                order: -1;
            }

        }

    </style>
</head>

<body>

<header>

    <h1>MONOPOLI PEMBELAJARAN</h1>

    <p>
        Bahasa Indonesia —
        Fungsi Kalimat & Ragam Paragraf
    </p>

</header>


<div class="game-container">


    <!-- PAPAN -->

    <div class="board-container">

        <div class="board">

            <img
                src="assets/papan-monopoli.jpg"
                alt="Papan Monopoli Pembelajaran"
            >

        </div>

    </div>


    <!-- PANEL PERMAINAN -->

    <div class="panel">

        <h2>🎮 Permainan</h2>


        <div class="player-box">

            <b>Pemain Aktif</b>

            <div id="playerName">
                Pemain 1
            </div>

            <div
                id="playerMoney"
                class="money"
            >
                Rp15.000,-
            </div>

        </div>


        <div class="dice">

            🎲

        </div>


        <button onclick="lemparDadu()">

            LEMPAR DADU

        </button>


        <button onclick="mulaiGame()">

            MULAI PERMAINAN

        </button>


        <div id="status">

            Permainan siap dimulai.

        </div>

    </div>

</div>


<script>

function mulaiGame() {

    document.getElementById("status").textContent =
        "Permainan dimulai! Giliran Pemain 1.";

}


function lemparDadu() {

    const angka =
        Math.floor(Math.random() * 6) + 1;

    document.querySelector(".dice").textContent =
        angka;

    document.getElementById("status").textContent =
        "Dadu menunjukkan angka " + angka + ".";

}

</script>

</body>

</html>
