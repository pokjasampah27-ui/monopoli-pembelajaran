<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monopoli Pembelajaran</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #163b2c;
    font-family: Arial, sans-serif;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: #163b2c;
    color: white;
    text-align: center;
    padding: 15px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 5px 0 0;
}


/* =========================
   SETUP PEMAIN
========================= */

.setup {
    width: min(700px, 94%);
    margin: 25px auto;
    background: #fffdf7;
    padding: 25px;
    border-radius: 15px;
}

.setup h2 {
    color: #163b2c;
}

.player-count {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
    margin: 10px 0 20px;
}

.player-count button {
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 8px;
    background: white;
    cursor: pointer;
    font-weight: bold;
}

.player-count button.active {
    background: #163b2c;
    color: white;
}

.player-input {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 8px;
    margin-bottom: 8px;
}

.player-input div {
    display: grid;
    place-items: center;
    background: #e9eee9;
    border-radius: 7px;
    font-weight: bold;
}

.player-input input {
    width: 100%;
    padding: 11px;
    border: 1px solid #bbb;
    border-radius: 7px;
}

.start-button,
.roll-button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #163b2c;
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.start-button:hover,
.roll-button:hover {
    background: #255743;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* =========================
   AREA GAME
========================= */

.game {
    width: min(1450px, 96%);
    margin: 15px auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 15px;
}

.hidden {
    display: none;
}


/* =========================
   PAPAN
========================= */

.board-container {
    background: #111;
    padding: 8px;
    border-radius: 12px;
}

.board {
    position: relative;
    background: white;
    overflow: hidden;
    border-radius: 6px;
}

.board img {
    display: block;
    width: 100%;
    height: auto;
}


/* =========================
   PION
========================= */

.tokens {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.token {
    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow: 0 2px 5px #0008;

    transform: translate(-50%, -50%);

    display: grid;
    place-items: center;

    color: white;

    font-size: 12px;

    font-weight: bold;

    transition:
        left 0.25s ease,
        top 0.25s ease;
}


/* =========================
   PANEL
========================= */

.panel {
    background: #fffdf7;
    padding: 15px;
    border-radius: 12px;
}

.panel h2 {
    margin-top: 0;
    color: #163b2c;
}

.player-card {
    background: #edf3ef;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 7px;
}

.player-card.active {
    border: 3px solid #d5a62d;
}

.player-color {
    display: inline-block;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    margin-right: 5px;
}

.money {
    color: #176b3a;
    font-weight: bold;
}

.dice {
    text-align: center;
    font-size: 65px;
    margin: 10px;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #eee7d6;
    border-radius: 8px;
    line-height: 1.5;
}

.petak-info {
    margin-top: 10px;
    padding: 10px;
    background: #e8f0ea;
    border-radius: 8px;
}

.petak-info b {
    color: #163b2c;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .game {
        grid-template-columns: 1fr;
    }

    .panel {
        order: -1;
    }

}

</style>
</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <h1>MONOPOLI PEMBELAJARAN</h1>

    <p>
        Bahasa Indonesia —
        Fungsi Kalimat & Ragam Paragraf
    </p>

</header>



<!-- ==================================================
     SETUP PEMAIN
================================================== -->

<section
    id="setup"
    class="setup"
>

    <h2>🎮 Persiapan Permainan</h2>

    <p>
        Pilih jumlah pemain.
        Permainan dapat dimainkan oleh
        <b>2 sampai 7 pemain</b>.
    </p>


    <div class="player-count">

        <button onclick="pilihJumlah(2)">2</button>

        <button onclick="pilihJumlah(3)">3</button>

        <button onclick="pilihJumlah(4)">4</button>

        <button onclick="pilihJumlah(5)">5</button>

        <button onclick="pilihJumlah(6)">6</button>

        <button onclick="pilihJumlah(7)">7</button>

    </div>


    <div id="namaPemain"></div>


    <button
        class="start-button"
        onclick="mulaiPermainan()"
    >
        MULAI PERMAINAN
    </button>

</section>



<!-- ==================================================
     AREA GAME
================================================== -->

<section
    id="game"
    class="game hidden"
>


    <!-- =========================
         PAPAN
    ========================= -->

    <div class="board-container">

        <div
            id="board"
            class="board"
        >

            <img
                src="assets/papan-monopoli.jpg"
                alt="Papan Monopoli Pembelajaran"
            >


            <!-- PION -->

            <div
                id="tokens"
                class="tokens"
            ></div>

        </div>

    </div>



    <!-- =========================
         PANEL PERMAINAN
    ========================= -->

    <div class="panel">

        <h2>🎲 Permainan</h2>


        <div id="daftarPemain"></div>


        <hr>


        <h3>Giliran</h3>

        <div id="giliran">
            -
        </div>


        <div
            id="uangGiliran"
            class="money"
        >
            Rp0,-
        </div>


        <div
            id="dadu"
            class="dice"
        >
            🎲
        </div>


        <button
            id="lempar"
            class="roll-button"
            onclick="lemparDadu()"
        >
            LEMPAR DADU
        </button>


        <div
            id="status"
            class="status"
        >
            Permainan siap.
        </div>


        <div
            id="petakInfo"
            class="petak-info"
        >
            <b>Posisi:</b>
            START
        </div>

    </div>

</section>



<script>

================================================== */

    {

    },

    },

    {

    },

    {

    },

    {
        id: 38,
        nama: "Petak 38",
        tipe: "kosong"
    },

    {
        id: 39,
        nama: "Petak 39",
        tipe: "kosong"
    }

];



/* ==================================================
   DATA PEMAIN
================================================== */


let jumlahPemain = 2;

let pemain = [];

let pemainAktif = 0;

let sedangBerjalan = false;


const warnaPemain = [

    "#d62828",

    "#2474d2",

    "#2a9d62",

    "#f4a261",

    "#7b3fb5",

    "#008c95",

    "#e07a00"

];



/* ==================================================
   PILIH JUMLAH PEMAIN
================================================== */


function pilihJumlah(jumlah) {

    jumlahPemain = jumlah;


    document
        .querySelectorAll(".player-count button")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    const tombol =

        document.querySelector(
            '.player-count button:nth-child(' +
            (jumlah - 1) +
            ')'
        );


    if (tombol) {

        tombol.classList.add("active");

    }


    buatInputNama();

}



/* ==================================================
   INPUT NAMA PEMAIN
================================================== */


function buatInputNama() {

    const container =

        document.getElementById(
            "namaPemain"
        );


    container.innerHTML = "";


    for (
        let i = 0;
        i < jumlahPemain;
        i++
    ) {

        container.innerHTML += `

            <div class="player-input">

                <div>
                    ${i + 1}
                </div>

                <input
                    id="nama${i}"
                    value="Pemain ${i + 1}"
                    maxlength="20"
                >

            </div>

        `;

    }

}



/* ==================================================
   MULAI PERMAINAN
================================================== */


function mulaiPermainan() {

    pemain = [];


    for (
        let i = 0;
        i < jumlahPemain;
        i++
    ) {

        const input =

            document.getElementById(
                "nama" + i
            );


        let nama =

            input
            ? input.value.trim()
            : "";


        if (!nama) {

            nama =
                "Pemain " + (i + 1);

        }


        pemain.push({

            id: i,

            nama: nama,

            uang: 15000,

            /*
             * SANGAT PENTING:
             *
             * posisi 0 = START
             *
             * Bukan Penjara.
             */

            posisi: 0,

            warna: warnaPemain[i]

        });

    }


    pemainAktif = 0;

    sedangBerjalan = true;


    document
        .getElementById("setup")
        .classList.add("hidden");


    document
        .getElementById("game")
        .classList.remove("hidden");


    tampilkanPemain();

    tampilkanPion();

    tampilkanGiliran();

    tampilkanPetak();


    document
        .getElementById("status")
        .textContent =

        "Permainan dimulai dari START. " +
        "Giliran " +
        pemain[0].nama +
        ".";

}



/* ==================================================
   TAMPILKAN PEMAIN
================================================== */


function tampilkanPemain() {

    const container =

        document.getElementById(
            "daftarPemain"
        );


    container.innerHTML = "";


    pemain.forEach(function(p, i) {

        const div =
            document.createElement("div");


        div.className =
            "player-card";


        if (i === pemainAktif) {

            div.classList.add("active");

        }


        div.innerHTML = `

            <span
                class="player-color"
                style="background:${p.warna}"
            ></span>

            <b>${p.nama}</b>

            <br>

            <span class="money">
                ${formatUang(p.uang)}
            </span>

            <br>

            Posisi:
            ${PETAK[p.posisi].nama}

        `;


        container.appendChild(div);

    });

}



/* ==================================================
   TAMPILKAN GILIRAN
================================================== */


function tampilkanGiliran() {

    const p =
        pemain[pemainAktif];


    if (!p) {

        return;

    }


    document
        .getElementById("giliran")
        .textContent =
        p.nama;


    document
        .getElementById("uangGiliran")
        .textContent =
        formatUang(p.uang);


    tampilkanPemain();

}



/* ==================================================
   TAMPILKAN PETAK
================================================== */


function tampilkanPetak() {

    const p =
        pemain[pemainAktif];


    if (!p) {

        return;

    }


    const petak =
        PETAK[p.posisi];


    document
        .getElementById("petakInfo")
        .innerHTML =

        "<b>Posisi:</b> " +
        petak.nama +
        "<br>" +
        "<b>Nomor petak:</b> " +
        petak.id;

}



/* ==================================================
   FORMAT UANG
================================================== */


function formatUang(jumlah) {

    return (

        "Rp" +

        jumlah.toLocaleString("id-ID") +

        ",-"

    );

}



/* ==================================================
   LEMPAR DADU
================================================== */


function lemparDadu() {

    if (!sedangBerjalan) {

        return;

    }


    const tombol =

        document.getElementById(
            "lempar"
        );


    tombol.disabled = true;


    const angka =

        Math.floor(
            Math.random() * 6
        ) + 1;


    document
        .getElementById("dadu")
        .textContent =
        angka;


    const p =
        pemain[pemainAktif];


    document
        .getElementById("status")
        .textContent =

        p.nama +
        " mendapatkan angka " +
        angka +
        ". Pion bergerak dari " +
        PETAK[p.posisi].nama +
        ".";


    bergerakPion(
        p,
        angka
    );

}



/* ==================================================
   GERAK PION
================================================== */


function bergerakPion(
    p,
    langkah
) {

    let jalan = 0;


    const posisiAwal =
        p.posisi;


    const interval =

        setInterval(function() {

            /*
             * Bergerak SATU PETAK
             * setiap langkah.
             */

            p.posisi++;


            /*
             * Jika melewati petak terakhir,
             * kembali ke START.
             */

            if (
                p.posisi >= PETAK.length
            ) {

                p.posisi = 0;


                /*
                 * Bonus ketika melewati START.
                 */

                p.uang += 200;


                document
                    .getElementById("status")
                    .textContent =

                    p.nama +
                    " melewati START " +
                    "dan mendapatkan bonus " +
                    formatUang(200) +
                    ".";

            }


            tampilkanPion();

            tampilkanGiliran();

            tampilkanPetak();


            jalan++;


            if (
                jalan >= langkah
            ) {

                clearInterval(
                    interval
                );


                const petakAkhir =
                    PETAK[p.posisi];


                document
                    .getElementById("status")
                    .textContent =

                    p.nama +
                    " berhenti di " +
                    petakAkhir.nama +
                    ".";


                setTimeout(
                    gantiGiliran,
                    1200
                );

            }

        }, 350);

}



/* ==================================================
   KOORDINAT PION

   CATATAN:

   Ini masih koordinat sementara.

   Setelah urutan petak papan kita
   pastikan, koordinat ini akan
   disesuaikan dengan posisi sebenarnya
   pada gambar papanmu.
================================================== */


function posisiPapan(posisi) {

    /*
     * BARIS BAWAH
     *
     * START berada sebagai titik awal.
     */

    if (posisi <= 10) {

        return {

            left:
                5 +
                posisi * 9 +
                "%",

            top:
                "95%"

        };

    }


    /*
     * SISI KANAN
     */

    if (posisi <= 20) {

        return {

            left:
                "95%",

            top:
                95 -
                (posisi - 10) * 9 +
                "%"

        };

    }


    /*
     * BARIS ATAS
     */

    if (posisi <= 30) {

        return {

            left:
                95 -
                (posisi - 20) * 9 +
                "%",

            top:
                "5%"

        };

    }


    /*
     * SISI KIRI
     */

    return {

        left:
            "5%",

        top:
            5 +
            (posisi - 30) * 9 +
            "%"

    };

}



/* ==================================================
   TAMPILKAN PION
================================================== */


function tampilkanPion() {

    const container =

        document.getElementById(
            "tokens"
        );


    container.innerHTML = "";


    pemain.forEach(function(p) {

        const pion =

            document.createElement(
                "div"
            );


        pion.className =
            "token";


        const posisi =
            posisiPapan(
                p.posisi
            );


        pion.style.left =
            posisi.left;


        pion.style.top =
            posisi.top;


        pion.style.background =
            p.warna;


        pion.textContent =
            p.id + 1;


        container.appendChild(
            pion
        );

    });

}



/* ==================================================
   GANTI GILIRAN
================================================== */


function gantiGiliran() {

    pemainAktif++;


    if (
        pemainAktif >=
        pemain.length
    ) {

        pemainAktif = 0;

    }


    tampilkanGiliran();

    tampilkanPetak();


    document
        .getElementById("lempar")
        .disabled = false;


    document
        .getElementById("status")
        .textContent =

        "Giliran " +
        pemain[pemainAktif].nama +
        ".";

}



/* ==================================================
   MULAI FORM PEMAIN
================================================== */

pilihJumlah(2);

</script>

</html>
